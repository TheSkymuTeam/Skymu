name: Skymu (BETA)

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '5.0.x'

    - name: 1. Build Yggdrasil
      run: dotnet build Yggdrasil/Yggdrasil.csproj --configuration Release --self-contained false

    - name: 2. Build the plugins
      run: |
        Get-ChildItem -Path "Plugins" -Filter "*.csproj" -Recurse | ForEach-Object {
          dotnet build $_.FullName --configuration Release -p:AppendRuntimeIdentifierToOutputPath=false --self-contained false
        }
    - name: 3. Build Skymu
      run: dotnet build Skymu/Skymu.csproj --configuration Release -p:AppendRuntimeIdentifierToOutputPath=false --self-contained false

    - name: 4. Build the Windows installer
      run: makensis NSIS/SkymuBetaSetup-Publish.nsi

    - name: 5. Upload zipped Windows installer as artifact
      uses: actions/upload-artifact@v7
      with:
        name: based
        path: 'NSIS/Skymu Installer (BETA).exe'
        retention-days: 7
        archive: true
     
    - name: 5. Upload zipped macOS binary (x64) as artifact
      uses: actions/upload-artifact@v7
      with:
        name: nightly-mac-x64
        path: 'Skymu/bin/Publish/macos-x64'
        retention-days: 7
        archive: true
