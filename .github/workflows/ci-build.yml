
name: Skymu (BETA)

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '6.0.x'

    - name: Build Yggdrasil
      run: dotnet build Yggdrasil/Yggdrasil.csproj --configuration Release

    - name: Build Plugins
      shell: pwsh
      run: |
        Get-ChildItem -Path "Plugins" -Filter "*.csproj" -Recurse | ForEach-Object {
          dotnet build $_.FullName --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }

    - name: Publish Skymu for Windows x86, x64 and ARM64
      shell: pwsh
      run: |
        foreach ($RID in "win-x86", "win-x64", "win-arm64") {
          dotnet publish Skymu/Skymu.csproj --configuration Release --runtime $RID -o "out/$RID"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          New-Item -ItemType Directory -Force -Path "out/$RID/Plugins" | Out-Null
          Copy-Item -Path "Plugins/bin/*" -Destination "out/$RID/Plugins" -Recurse -Force
        }

    - name: Build NSIS installers
      shell: pwsh
      run: |
        foreach ($A in "x86", "x64", "ARM64") {
          makensis "NSIS/SkymuBetaSetup-$A.nsi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }

    - name: Export Windows x86 installer
      uses: actions/upload-artifact@v7
      with:
        name: Skymu-Windows-x86-Installer
        path: 'NSIS/Skymu.Beta.Installer.x86.exe'
        retention-days: 7
        archive: true

    - name: Export Windows x64 installer
      uses: actions/upload-artifact@v7
      with:
        name: Skymu-Windows-x64-Installer
        path: 'NSIS/Skymu.Beta.Installer.x64.exe'
        retention-days: 7
        archive: true

    - name: Export Windows ARM64 installer
      uses: actions/upload-artifact@v7
      with:
        name: Skymu-Windows-ARM64-Installer
        path: 'NSIS/Skymu.Beta.Installer.ARM64.exe'
        retention-days: 7
        archive: true

  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '6.0.x'

    - name: Build Yggdrasil
      run: dotnet build Yggdrasil/Yggdrasil.csproj --configuration Release

    - name: Build Plugins
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p Skymu/bin/Release/Plugins

        while IFS= read -r -d '' project; do
          NAME="$(basename "$(dirname "$project")")"
          dotnet publish "$project" --configuration Release --no-self-contained -o "Skymu/bin/Release/Plugins/$NAME"
        done < <(find Plugins -name '*.csproj' -print0)

    - name: Publish Skymu for macOS Intel and Apple Silicon
      shell: bash
      run: |
        set -euo pipefail

        for RID in osx-x64 osx-arm64; do
          dotnet publish Skymu/Skymu.csproj --configuration Release --runtime "$RID" --self-contained true -o "out/$RID"

          mkdir -p "out/$RID/Plugins"
          cp -R Skymu/bin/Release/Plugins/. "out/$RID/Plugins/"

          test -f "out/$RID/Skymu"
        done

    - name: Write Info.plist
      shell: bash
      run: |
        cat > Info.plist <<'PLIST'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>CFBundleName</key><string>Skymu</string>
          <key>CFBundleDisplayName</key><string>Skymu</string>
          <key>CFBundleIdentifier</key><string>app.skymu.client</string>
          <key>CFBundleExecutable</key><string>Skymu</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>LSMinimumSystemVersion</key><string>10.15</string>
        </dict>
        </plist>
        PLIST

    - name: Package, sign and create DMGs
      shell: bash
      run: |
        set -euo pipefail

        mkdir -p dist

        package() {
          RID="$1"
          APP="dist/$2.app"
          VOL="$3"
          DMG="dist/$4.dmg"

          mkdir -p "$APP/Contents/MacOS"
          cp -R "out/$RID/." "$APP/Contents/MacOS/"
          chmod +x "$APP/Contents/MacOS/Skymu"
          cp Info.plist "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"
          hdiutil create -volname "$VOL" -srcfolder "$APP" -ov -format UDZO "$DMG"
        }

        package osx-x64 Skymu-Intel "Skymu Intel" Skymu-macOS-Intel
        package osx-arm64 Skymu-AppleSilicon "Skymu Apple Silicon" Skymu-macOS-AppleSilicon

    - name: Export macOS Intel DMG
      uses: actions/upload-artifact@v7
      with:
        name: Skymu-MacOS-Intel-DMG
        path: dist/Skymu-macOS-Intel.dmg
        retention-days: 7
        archive: true

    - name: Export macOS Apple Silicon DMG
      uses: actions/upload-artifact@v7
      with:
        name: Skymu-MacOS-AppleSilicon-DMG
        path: dist/Skymu-macOS-AppleSilicon.dmg
        retention-days: 7
        archive: true

  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '6.0.x'

    - name: Build Yggdrasil
      run: dotnet build Yggdrasil/Yggdrasil.csproj --configuration Release

    - name: Build Plugins
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p Skymu/bin/Release/Plugins

        while IFS= read -r -d '' project; do
          NAME="$(basename "$(dirname "$project")")"
          dotnet publish "$project" --configuration Release --no-self-contained -o "Skymu/bin/Release/Plugins/$NAME"
        done < <(find Plugins -name '*.csproj' -print0)

    - name: Publish Skymu for Linux x64 and ARM64
      shell: bash
      run: |
        set -euo pipefail

        for RID in linux-x64 linux-arm64; do
          dotnet publish Skymu/Skymu.csproj --configuration Release --runtime "$RID" --self-contained true -o "out/$RID"

          mkdir -p "out/$RID/Plugins"
          cp -R Skymu/bin/Release/Plugins/. "out/$RID/Plugins/"

          test -f "out/$RID/Skymu"
        done

    - name: Download appimagetool
      shell: bash
      run: |
        set -euo pipefail
        curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool

    - name: Package AppImages
      shell: bash
      run: |
        set -euo pipefail

        mkdir -p dist
        printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==' | base64 -d > skymu.png

        package() {
          RID="$1"
          ARCH="$2"
          APPDIR="AppDir-$ARCH"

          mkdir -p "$APPDIR/usr/bin"
          cp -R "out/$RID/." "$APPDIR/usr/bin/"
          chmod +x "$APPDIR/usr/bin/Skymu"
          cp skymu.png "$APPDIR/skymu.png"

          cat > "$APPDIR/skymu.desktop" <<'DESKTOP'
        [Desktop Entry]
        Type=Application
        Name=Skymu
        Exec=Skymu
        Icon=skymu
        Categories=Network;InstantMessaging;
        DESKTOP

          cat > "$APPDIR/AppRun" <<'APPRUN'
        #!/bin/sh
        HERE="$(dirname "$(readlink -f "$0")")"
        exec "$HERE/usr/bin/Skymu" "$@"
        APPRUN

          chmod +x "$APPDIR/AppRun"
          ARCH="$ARCH" ./appimagetool --appimage-extract-and-run "$APPDIR" "dist/Skymu-$ARCH.AppImage"
        }

        package linux-x64 x86_64
        package linux-arm64 aarch64

    - name: Export Linux x86_64 AppImage
      uses: actions/upload-artifact@v7
      with:
        name: Skymu-Linux-AMD64-AppImage
        path: dist/Skymu-x86_64.AppImage
        retention-days: 7
        archive: true

    - name: Export Linux ARM64 AppImage
      uses: actions/upload-artifact@v7
      with:
        name: Skymu-Linux-ARM64-AppImage
        path: dist/Skymu-aarch64.AppImage
        retention-days: 7
        archive: true
